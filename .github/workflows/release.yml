name: Release

# 推 v* 标签就自动编译并发布安装包（不是只发源码）
# 也可以在 Actions 页面手动触发，填一个已存在的 tag
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发版的 tag（例如 v1.5.1，需已存在）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: 打包 Windows 安装包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 跑回归测试
        run: |
          npm run test:wake
          npm run test:pet
          npm run test:orch
          npm run test:llm
          npm run test:proactive
          npm run test:tray
          npm run test:context
          npm run test:hotkey
          npm run test:pet-top
          npm run test:boot
          npm run test:ui

      - name: 构建渲染层
        run: npm run build:renderer

      - name: 编译安装包（NSIS）
        # --publish never：产物留在本地，交给下一步统一上传，避免半路发布失败留下空 Release
        run: npx electron-builder --win nsis --publish never

      - name: 检查安装包里真的带上了托盘图标
        # 历史事故：图标只放在仓库 build/ 下，而 electron-builder 的 files 不含 build/，
        # 于是安装版里图标根本不存在 → 右下角托盘看不见。这里是发布前的最后一道闸。
        shell: bash
        run: node build/_packed_check.mjs

      - name: 列出产物
        shell: bash
        run: |
          echo "----- 产物清单 -----"
          ls -lh release*/ || true

      - name: 清理不上传的文件
        shell: bash
        run: rm -f release*/builder-debug.yml

      - name: 计算校验和
        shell: bash
        run: |
          cd release*
          for f in *.exe; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256.txt"
            echo "SHA256: $f"
            cat "$f.sha256.txt"
          done

      - name: 生成 Release 说明（抽 CHANGELOG 对应版本）
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          node build/changelog-section.mjs "${TAG#v}" > release-body.md
          head -12 release-body.md

      - name: 发布到 GitHub Release（附编译产物）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            release*/*.exe
            release*/*.exe.sha256.txt
            release*/*.blockmap
            release*/*.yml
